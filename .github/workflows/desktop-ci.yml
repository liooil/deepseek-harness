name: Desktop CI

on:
  pull_request:
  push:
    branches:
      - master
      - 'sync/upstream-**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PRIMARY_NODE_VERSION: '24'
  BUN_VERSION: '1.4.0'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  static:
    name: repository and desktop contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Check workspace policy
        run: pnpm run constraints

      - name: Run desktop integration tests
        run: >-
          pnpm exec vitest run
          apps/desktop/tests
          apps/cli/tests/profile-hmr.spec.ts
          apps/cli/tests/telemetry-switch.spec.ts
          packages/client/modules/tests/node-half.client.spec.ts
          packages/fs/tool-fs-search/tests/rg-path.spec.ts
          packages/fs/tool-fs-search/tests/rg-sidecar.spec.ts
          packages/sandbox/sandbox-local/tests/acl-grants.spec.ts
          scripts/ci-workflow.spec.ts

      - name: Typecheck
        run: pnpm run typecheck
      - name: Build official workspace
        run: pnpm run build:official


      - name: Hygiene
        run: pnpm run hygiene

      - name: Documentation
        run: pnpm run doc-sync

      - name: Check expected-output filenames
        shell: bash
        run: scripts/check-expected-filenames.sh
      - name: Build desktop executable
        run: pnpm run build:desktop-exe -- --target=linux-x64 --skip-build

      - name: Smoke desktop executable
        shell: bash
        run: |
          set -euo pipefail
          product=dist-desktop/dsh-desktop-linux-x64
          "$product" --version
          "$product" --smoke --cwd "$PWD"


  native-smoke:
    name: desktop smoke / ${{ matrix.target }}
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: static
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            runner: windows-2025
            output: dsh-desktop-windows-x64.exe
          - target: macos-arm64
            runner: macos-15
            output: dsh-desktop-macos-arm64
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      - name: Build official workspace
        run: pnpm run build:official

      - name: Build desktop executable
        run: pnpm run build:desktop-exe -- --target=${{ matrix.target }} --skip-build

      - name: Smoke desktop executable (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          product="dist-desktop/${{ matrix.output }}"
          "$product" --version
          "$product" --smoke --cwd "$PWD"

      - name: Smoke desktop executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $product = Join-Path dist-desktop '${{ matrix.output }}'
          & $product --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $product --smoke --cwd $PWD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
